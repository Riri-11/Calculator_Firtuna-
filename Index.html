<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>

<style>
    body {
        background: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial;
    }

    .calculator {
        background: #222;
        padding: 20px;
        border-radius: 10px;
        width: 320px;
    }

    input {
        width: 100%;
        height: 50px;
        font-size: 22px;
        margin-bottom: 10px;
        text-align: right;
        padding-right: 10px;
    }

    button {
        width: 65px;
        height: 45px;
        margin: 4px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .operator { background: #000; color: white; }
    .function { background: #000; color: white; }
    .clear { background: red; color: white; }
    .equal { background:#000; color: white; width: 140px; }
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" disabled>

    <div>
        <button class="function" onclick="func('sin')">sin</button>
        <button class="function" onclick="func('cos')">cos</button>
        <button class="function" onclick="func('tan')">tan</button>
        <button class="clear" onclick="clearDisplay()">C</button>
    </div>

    <div>
        <button class="function" onclick="func('sqrt')">√</button>
        <button class="function" onclick="func('pow')">x²</button>
        <button class="function" onclick="func('log')">log</button>
        <button class="operator" onclick="append('/')">/</button>
    </div>

    <div>
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">*</button>
    </div>

    <div>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">-</button>
    </div>

    <div>
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>
    </div>

    <div>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let display = document.getElementById("display");

    function append(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }

    function func(type) {
        let value = parseFloat(display.value);
        if (isNaN(value)) return;

        switch (type) {
            case 'sin':
                display.value = Math.sin(value * Math.PI / 180);
                break;
            case 'cos':
                display.value = Math.cos(value * Math.PI / 180);
                break;
            case 'tan':
                display.value = Math.tan(value * Math.PI / 180);
                break;
            case 'sqrt':
                display.value = Math.sqrt(value);
                break;
            case 'pow':
                display.value = Math.pow(value, 2);
                break;
            case 'log':
                display.value = Math.log10(value);
                break;
        }
    }
</script>
<script src="java.js"></script>
</body>
</html>
